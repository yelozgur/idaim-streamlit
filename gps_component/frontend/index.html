<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .gps-button {
    width: 100%;
    min-height: 56px;
    padding: 16px 24px;
    font-size: 18px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #4285f4, #1a73e8);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .gps-button:active {
    transform: scale(0.98);
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .gps-button:disabled {
    background: #9aa0a6;
    cursor: not-allowed;
  }
  .gps-status {
    margin-top: 8px;
    padding: 8px 12px;
    font-size: 14px;
    border-radius: 8px;
    text-align: center;
    display: none;
  }
  .gps-status.loading {
    display: block;
    background: #fff3cd;
    color: #856404;
  }
  .gps-status.success {
    display: block;
    background: #d4edda;
    color: #155724;
  }
  .gps-status.error {
    display: block;
    background: #f8d7da;
    color: #721c24;
  }
  .accuracy-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 2px 8px;
    font-size: 11px;
    background: rgba(255,255,255,0.3);
    border-radius: 10px;
  }
</style>
</head>
<body>

<button class="gps-button" id="gpsBtn">📍 Konumumu Al</button>
<div class="gps-status" id="status"></div>

<script>
  // Streamlit component API
  const { Streamlit } = window;
  if (!Streamlit) {
    console.error("Streamlit global not found — component context missing");
  }

  // Streamlit'ten gelen config
  function getConfig() {
    // Default değerler (component_value henüz set edilmediyse)
    return window._gpsConfig || { highAccuracy: true };
  }

  // Butonu ve status div'ini al
  const btn = document.getElementById('gpsBtn');
  const statusDiv = document.getElementById('status');

  // Sayfa yüklendiğinde config'i al
  function onRender(event) {
    if (event.detail && event.detail.args) {
      window._gpsConfig = {
        label: event.detail.args.label || "📍 Konumumu Al",
        highAccuracy: event.detail.args.highAccuracy !== false,
        defaultLat: event.detail.args.defaultLat,
        defaultLon: event.detail.args.defaultLon,
      };
      if (window._gpsConfig.label) {
        btn.textContent = window._gpsConfig.label;
      }
    }
  }

  if (Streamlit) {
    Streamlit.events.addEventListener("streamlit:render", onRender);
    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(110);
  }

  // Buton tıklama
  btn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      showStatus("error", "❌ Tarayıcı GPS desteklemiyor");
      return;
    }

    // İzin durumunu kontrol et
    if (navigator.permissions) {
      navigator.permissions.query({ name: 'geolocation' }).then((perm) => {
        if (perm.state === 'denied') {
          showStatus("error", "⚠️ Konum izni reddedilmiş. Tarayıcı ayarlarından izin verin.");
          return;
        }
        requestPosition();
      }).catch(() => requestPosition());  // Eski tarayıcılarda permissions API yok
    } else {
      requestPosition();
    }
  });

  function requestPosition() {
    btn.disabled = true;
    btn.textContent = "⏳ Konum alınıyor...";
    showStatus("loading", "📡 GPS sinyali aranıyor, lütfen bekleyin...");

    const config = getConfig();
    const options = {
      enableHighAccuracy: config.highAccuracy,
      timeout: 15000,         // 15sn timeout
      maximumAge: 30000,      // 30sn cache kabul et
    };

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const acc = Math.round(pos.coords.accuracy);

        const accBadge = acc < 50
          ? '<span class="accuracy-badge">✅ Yüksek doğruluk</span>'
          : acc < 200
          ? '<span class="accuracy-badge">🟢 Orta</span>'
          : '<span class="accuracy-badge">🟡 Düşük</span>';

        showStatus("success", `✅ Konum alındı: ${lat.toFixed(5)}, ${lon.toFixed(5)} ${accBadge}`);

        btn.textContent = "✅ Konum Alındı";
        btn.disabled = false;

        // Streamlit'e gönder
        if (Streamlit) {
          Streamlit.setComponentValue({
            lat: lat,
            lon: lon,
            accuracy: acc,
            timestamp: Date.now(),
          });
        }
      },
      (err) => {
        btn.textContent = "📍 Konumumu Al";
        btn.disabled = false;

        let msg = "";
        switch (err.code) {
          case err.PERMISSION_DENIED:
            msg = "❌ Konum izni reddedildi";
            break;
          case err.POSITION_UNAVAILABLE:
            msg = "❌ GPS sinyali alınamıyor (açık alana çıkın)";
            break;
          case err.TIMEOUT:
            msg = "⏱️ Zaman aşımı (tekrar deneyin)";
            break;
          default:
            msg = "❌ Konum hatası: " + err.message;
        }
        showStatus("error", msg);
      },
      options
    );
  }

  function showStatus(type, message) {
    statusDiv.className = "gps-status " + type;
    statusDiv.innerHTML = message;
  }
</script>

</body>
</html>
